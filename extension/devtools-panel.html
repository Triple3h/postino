<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApiFix Network 捕获</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; background: Canvas; color: CanvasText; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border-bottom: 1px solid color-mix(in srgb, CanvasText 16%, transparent); }
      h1 { margin: 0; font-size: 14px; }
      button { border: 1px solid color-mix(in srgb, CanvasText 24%, transparent); border-radius: 6px; background: ButtonFace; color: ButtonText; padding: 5px 9px; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
      main { display: grid; grid-template-columns: minmax(360px, 1fr) minmax(300px, .8fr); height: calc(100vh - 43px); }
      .list { overflow: auto; border-right: 1px solid color-mix(in srgb, CanvasText 16%, transparent); }
      .request { display: grid; grid-template-columns: 72px 1fr 76px 72px; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid color-mix(in srgb, CanvasText 10%, transparent); cursor: pointer; font-size: 12px; }
      .request:hover, .request.selected { background: color-mix(in srgb, Highlight 18%, transparent); }
      .method { font-weight: 700; color: #2563eb; }
      .url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .status.ok { color: #16a34a; }
      .status.err { color: #dc2626; }
      .detail { padding: 12px; overflow: auto; }
      pre { white-space: pre-wrap; word-break: break-word; padding: 10px; border-radius: 8px; background: color-mix(in srgb, CanvasText 8%, transparent); font-size: 12px; }
      .empty { padding: 28px; color: color-mix(in srgb, CanvasText 60%, transparent); text-align: center; }
      .toolbar { display: flex; gap: 8px; align-items: center; }
      .hint { font-size: 12px; color: color-mix(in srgb, CanvasText 65%, transparent); }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>ApiFix Network 捕获</h1>
        <div class="hint">从当前 DevTools Network 流捕获请求，选中后可存入待导入队列。</div>
      </div>
      <div class="toolbar">
        <button id="clearBtn">清空</button>
        <button id="openBtn">打开全屏页</button>
        <button id="sidePanelBtn">打开侧边栏</button>
        <button id="importBtn" disabled>存入待导入</button>
      </div>
    </header>
    <main>
      <section id="requestList" class="list"><div class="empty">打开页面并发起请求后会显示在这里。</div></section>
      <section class="detail">
        <h2 id="detailTitle">未选择请求</h2>
        <pre id="detailPre">选择左侧请求查看可导入内容。</pre>
      </section>
    </main>
    <script src="devtools-panel.js"></script>
  </body>
</html>
