<script>
/**
 * Inline CryptoJS SHA-256 polyfill for sandbox
 * (sandbox pages cannot load external script files)
 */
(function(root) {
  var K = [
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
  ];

  function stringToBytes(str) {
    var bytes = [];
    for (var i = 0; i < str.length; i++) {
      var code = str.charCodeAt(i);
      if (code < 0x80) { bytes.push(code); }
      else if (code < 0x800) { bytes.push(0xc0 | (code >> 6), 0x80 | (code & 0x3f)); }
      else if (code < 0xd800 || code >= 0xe000) { bytes.push(0xe0 | (code >> 12), 0x80 | ((code >> 6) & 0x3f), 0x80 | (code & 0x3f)); }
      else { i++; var cp = 0x10000 + (((code & 0x3ff) << 10) | (str.charCodeAt(i) & 0x3ff)); bytes.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 0x3f), 0x80 | ((cp >> 6) & 0x3f), 0x80 | (cp & 0x3f)); }
    }
    return bytes;
  }

  function sha256(bytes) {
    var msgLen = bytes.length;
    var padded = bytes.slice();
    padded.push(0x80);
    while (padded.length % 64 !== 56) padded.push(0);
    var bitLen = msgLen * 8;
    for (var i = 56; i >= 0; i -= 8) padded.push(Math.floor(bitLen / Math.pow(2, i)) & 0xff);
    var h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;
    var h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
    for (var offset = 0; offset < padded.length; offset += 64) {
      var w = new Array(64);
      for (var j = 0; j < 16; j++) {
        w[j] = (padded[offset + j * 4] << 24) | (padded[offset + j * 4 + 1] << 16) | (padded[offset + j * 4 + 2] << 8) | padded[offset + j * 4 + 3];
      }
      for (var j = 16; j < 64; j++) {
        var s0 = ((w[j-15] >>> 7) | (w[j-15] << 25)) ^ ((w[j-15] >>> 18) | (w[j-15] << 14)) ^ (w[j-15] >>> 3);
        var s1 = ((w[j-2] >>> 17) | (w[j-2] << 15)) ^ ((w[j-2] >>> 19) | (w[j-2] << 13)) ^ (w[j-2] >>> 10);
        w[j] = (w[j-16] + s0 + w[j-7] + s1) | 0;
      }
      var a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
      for (var j = 0; j < 64; j++) {
        var S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
        var ch = (e & f) ^ (~e & g);
        var temp1 = (h + S1 + ch + K[j] + w[j]) | 0;
        var S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
        var maj = (a & b) ^ (a & c) ^ (b & c);
        var temp2 = (S0 + maj) | 0;
        h = g; g = f; f = e; e = (d + temp1) | 0;
        d = c; c = b; b = a; a = (temp1 + temp2) | 0;
      }
      h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0;
      h4 = (h4 + e) | 0; h5 = (h5 + f) | 0; h6 = (h6 + g) | 0; h7 = (h7 + h) | 0;
    }
    var hash = [h0, h1, h2, h3, h4, h5, h6, h7];
    var hex = '';
    for (var i = 0; i < hash.length; i++) hex += ('00000000' + (hash[i] >>> 0).toString(16)).slice(-8);
    return hex;
  }

  function SHA256(message) {
    var bytes = typeof message === 'string' ? stringToBytes(message) : message;
    var hashHex = sha256(bytes);
    return { toString: function() { return hashHex; } };
  }

  root.CryptoJS = { SHA256: SHA256 };
})(this);
</script>
<script>
/**
 * ApiFix Bin - Sandbox for executing user scripts (Pre-request Script)
 * This page runs in a sandboxed context with relaxed CSP,
 * allowing new Function() and eval() for user script execution.
 * 
 * Available globals: CryptoJS (SHA256), Math, Date, JSON, etc.
 */

// Listen for script execution requests from main page
window.addEventListener('message', (event) => {
  if (event.data && event.data.type === 'EXECUTE_SCRIPT') {
    const { script, headers, url, body, urlencoded, formdata, envVars, requestId } = event.data;

    try {
      // Rebuild the pm object
      const envStore = { ...envVars };

      const pm = {
        request: {
          headers: {
            _store: { ...headers },
            set(key, value) { this._store[key] = value; },
            get(key) { return this._store[key]; },
            remove(key) { delete this._store[key]; },
            has(key) { return key in this._store; },
          },
          body: {
            _raw: body,
            _fields: urlencoded.map(f => ({ ...f })),
            _formdata: formdata.map(f => ({ ...f })),
            set raw(val) { this._raw = val; },
            get raw() { return this._raw; },
            set(key, value) {
              const existing = this._fields.find(item => item.key === key);
              if (existing) { existing.value = value; existing.enabled = true; }
              else { this._fields.push({ key, value, enabled: true }); }
            },
            get(key) {
              const found = this._fields.find(item => item.key === key);
              return found ? found.value : undefined;
            },
          },
          url: {
            _url: url,
            set(val) { this._url = val; },
            get() { return this._url; },
            addQueryParams(key, value) {
              const sep = this._url.includes('?') ? '&' : '?';
              this._url += sep + encodeURIComponent(key) + '=' + encodeURIComponent(value);
            },
          },
        },
        environment: {
          set(key, value) { envStore[key] = value; },
          get(key) { return envStore[key]; },
          unset(key) { delete envStore[key]; },
          has(key) { return key in envStore; },
        },
      };

      // Postman-compatible alias object
      const postman = {
        setEnvironmentVariable(key, value) { pm.environment.set(key, value); },
        getEnvironmentVariable(key) { return pm.environment.get(key); },
        clearEnvironmentVariable(key) { pm.environment.unset(key); },
        setGlobalVariable(key, value) { pm.environment.set(key, value); },
        getGlobalVariable(key) { return pm.environment.get(key); },
        clearGlobalVariable(key) { pm.environment.unset(key); },
        environment: pm.environment,
        globals: pm.environment,
        request: pm.request,
      };

      const scriptConsole = {
        logs: [],
        log(...args) { this.logs.push({ type: 'log', args: args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)) }); },
        warn(...args) { this.logs.push({ type: 'warn', args: args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)) }); },
        error(...args) { this.logs.push({ type: 'error', args: args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)) }); },
      };

      // Execute the user script using new Function (allowed in sandbox)
      // Available in script: pm, postman, console, CryptoJS, Math, Date, JSON, etc.
      const fn = new Function(
        'pm', 'postman', 'console',
        'CryptoJS', 'Math', 'Date', 'parseInt', 'parseFloat',
        'JSON', 'encodeURIComponent', 'decodeURIComponent',
        'btoa', 'atob', 'setTimeout',
        script
      );
      fn(
        pm, postman, scriptConsole,
        CryptoJS, Math, Date, parseInt, parseFloat,
        JSON, encodeURIComponent, decodeURIComponent,
        btoa, atob, setTimeout
      );

      // Send result back to main page
      event.source.postMessage({
        type: 'SCRIPT_RESULT',
        requestId,
        success: true,
        result: {
          headers: pm.request.headers._store,
          url: pm.request.url._url,
          body: pm.request.body._raw,
          urlencoded: pm.request.body._fields,
          formdata: pm.request.body._formdata,
          envVars: envStore,
          logs: scriptConsole.logs,
        },
      }, '*');
    } catch (err) {
      // Send error back
      event.source.postMessage({
        type: 'SCRIPT_RESULT',
        requestId,
        success: false,
        error: err.message,
        logs: [],
      }, '*');
    }
  }
});

// Signal that sandbox is ready
window.parent.postMessage({ type: 'SANDBOX_READY' }, '*');
</script>
