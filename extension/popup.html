<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    width: 260px;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0e14;
    color: #e8edf4;
    text-align: center;
  }
  .logo {
    font-size: 28px;
    margin-bottom: 10px;
  }
  .title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .title span { color: #00e5a0; }
  .desc {
    font-size: 12px;
    color: #6b7f99;
    line-height: 1.5;
    margin-bottom: 16px;
  }
  .open-btn {
    width: 100%;
    padding: 12px;
    background: #00e5a0;
    border: none;
    border-radius: 8px;
    color: #0a0e14;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .open-btn:hover {
    filter: brightness(1.15);
    transform: translateY(-1px);
  }
</style>
</head>
<body>
  <div class="logo">⚡</div>
  <div class="title">Api<span>Fix</span> Bin</div>
  <div class="desc">轻量接口调试工具</div>
  <button class="open-btn" id="openBtn">打开 ApiFix Bin</button>
  <script src="popup.js"></script>
</body>
</html>
