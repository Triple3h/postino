name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Desktop: Windows + macOS ──
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_cmd: npm run build:desktop:win
            artifact_name: postino-win
            artifact_path: desktop/dist/*.exe
          - os: macos-latest
            build_cmd: npm run build:mac
            artifact_name: postino-mac
            artifact_path: desktop/dist/*.dmg

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmmirror.com

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --force
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Build
        run: ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}

  # ── Browser extension (Chrome / Edge) ──
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmmirror.com

      - name: Build extension
        run: node build.js --ext-only --no-typecheck

      - name: Package extension as zip
        run: |
          cd dist-extension
          zip -r ../postino-extension-${GITHUB_REF_NAME#v}.zip . -x "*.DS_Store"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: postino-extension
          path: postino-extension-*.zip

  # ── Publish GitHub Release ──
  publish:
    needs: [release, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: postino-win
          path: ./assets

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: postino-mac
          path: ./assets

      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: postino-extension
          path: ./assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./assets/*
          generate_release_notes: true
