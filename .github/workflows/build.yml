name: Build & Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: windows-latest
            build_cmd: npm run build
          - os: macos-latest
            build_cmd: npm run build:mac
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: |
          cd desktop
          npm install --force
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: 构建
        run: |
          cd desktop
          ${{ matrix.build_cmd }}

      - name: 上传安装包到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
