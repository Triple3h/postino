name: Build & Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: |
          cd desktop
          npm install
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: 构建 Windows
        run: |
          cd desktop
          npm run build

      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: desktop/dist/*.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: |
          cd desktop
          npm install
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: 构建 Mac
        run: |
          cd desktop
          npm run build:mac

      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: desktop/dist/*.dmg
